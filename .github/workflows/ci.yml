# Quality gate before main. Vercel deploys from main, so this is the check
# that must stay green — the local pre-push smoke-test is too slow to be
# the only gate and is skippable with SKIP_SMOKE_TEST=1.
#
# Blocking today: unit tests + lint on the test suite, plus Playwright
# login and tenant isolation. PRs hit the Vercel simy-app preview
# (needs VERCEL_AUTOMATION_BYPASS_SECRET) when that project actually
# builds. Docs / Dependabot / ignored-build PRs fall back to
# https://app.simy.ch. Pushes to main stay on production.
#
# Report-only: npm audit. Production deps currently include unfixed
# highs/criticals (xlsx has no patch; nuxt/vite pull more). Failing the
# job on that debt would make CI permanently red.
name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          # The navbar layout test launches Playwright's bundled Chromium.
          # ubuntu-latest sometimes ships broken Microsoft apt mirrors (403),
          # which makes `playwright install --with-deps` fail before browsers install.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/msprod.list || true
          npx playwright install --with-deps chromium

      - name: Start disposable Postgres
        run: |
          sudo apt-get update
          sudo apt-get install -y postgresql
          sudo service postgresql start
          sudo -u postgres psql -v ON_ERROR_STOP=1 -c "DO \$\$ BEGIN IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'simy_receipt') THEN CREATE ROLE simy_receipt LOGIN SUPERUSER PASSWORD 'simy_receipt'; END IF; END \$\$;"
          sudo -u postgres psql -tc "SELECT 1 FROM pg_database WHERE datname = 'simy_receipt_reset'" | grep -q 1 || sudo -u postgres psql -v ON_ERROR_STOP=1 -c "CREATE DATABASE simy_receipt_reset OWNER simy_receipt;"
          PG_HBA=$(sudo -u postgres psql -tAc "SHOW hba_file")
          grep -q simy_receipt "$PG_HBA" || printf '%s\n' 'host all simy_receipt 127.0.0.1/32 trust' 'host all simy_receipt ::1/128 trust' | sudo tee -a "$PG_HBA" >/dev/null
          sudo service postgresql reload

      - name: Unit tests
        env:
          RECEIPT_RESET_TEST_DATABASE_URL: postgres://simy_receipt:simy_receipt@127.0.0.1:5432/simy_receipt_reset
        run: npm test

      - name: Lint test suite
        run: npm run lint

      - name: Production dependency audit (report only)
        continue-on-error: true
        run: npm run audit:prod

  e2e:
    name: E2E login
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Vercel preview
        id: preview
        if: github.event_name == 'pull_request'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_PREVIEW_SHA: ${{ github.event.pull_request.head.sha }}
          E2E_PREVIEW_REF: ${{ github.head_ref }}
          E2E_PREVIEW_AUTHOR: ${{ github.event.pull_request.user.login }}
        run: node scripts/wait-for-simy-preview.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          # ubuntu-latest sometimes ships broken Microsoft apt mirrors (403),
          # which makes `playwright install --with-deps` fail before browsers install.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/msprod.list || true
          npx playwright install --with-deps chromium

      - name: Playwright
        env:
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_ISOLATION_PASSWORD: ${{ secrets.E2E_ISOLATION_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          E2E_BASE_URL: ${{ github.event_name == 'pull_request' && steps.preview.outputs.url || 'https://app.simy.ch' }}
        run: |
          using_preview=false
          case "${E2E_BASE_URL}" in
            https://app.simy.ch|https://app.simy.ch/) ;;
            *) using_preview=true ;;
          esac
          if [ "${{ github.event_name }}" = "pull_request" ] && [ "$using_preview" = true ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not set"
            exit 1
          fi
          npm run test:e2e
