# Quality gate before main. Vercel deploys from main, so this is the check
# that must stay green — the local pre-push smoke-test is too slow to be
# the only gate and is skippable with SKIP_SMOKE_TEST=1.
#
# Blocking today: unit tests + lint on the test suite, plus Playwright
# login and tenant isolation. PRs hit the Vercel simy-app preview
# (needs VERCEL_AUTOMATION_BYPASS_SECRET) when that project actually
# builds. Docs / Dependabot / ignored-build PRs fall back to
# https://app.simy.ch. Pushes to main stay on production.
#
# Report-only: npm audit. Production deps currently include unfixed
# highs/criticals (xlsx has no patch; nuxt/vite pull more). Failing the
# job on that debt would make CI permanently red.
name: CI

on:
  pull_request:
  merge_group:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  deployments: read

jobs:
  quality:
    name: Test and lint
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test

      - name: Lint test suite
        run: npm run lint

      - name: Production dependency audit (report only)
        continue-on-error: true
        run: npm run audit:prod

  e2e:
    name: E2E login
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Wait for Vercel preview
        id: preview
        if: github.event_name == 'pull_request' || github.event_name == 'merge_group'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          E2E_PREVIEW_SHA: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_sha || github.event.pull_request.head.sha }}
          E2E_PREVIEW_REF: ${{ github.event_name == 'merge_group' && github.event.merge_group.head_ref || github.head_ref }}
          E2E_PREVIEW_AUTHOR: ${{ github.event.pull_request.user.login }}
          E2E_PREVIEW_MODE: ${{ github.event_name }}
        run: node scripts/wait-for-simy-preview.mjs

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Install Chromium
        run: |
          # ubuntu-latest sometimes ships broken Microsoft apt mirrors (403),
          # which makes `playwright install --with-deps` fail before browsers install.
          sudo rm -f /etc/apt/sources.list.d/azure-cli.list \
            /etc/apt/sources.list.d/microsoft-prod.list \
            /etc/apt/sources.list.d/msprod.list || true
          npx playwright install --with-deps chromium

      - name: Playwright
        env:
          E2E_DEMO_PASSWORD: ${{ secrets.E2E_DEMO_PASSWORD }}
          E2E_ISOLATION_PASSWORD: ${{ secrets.E2E_ISOLATION_PASSWORD }}
          VERCEL_AUTOMATION_BYPASS_SECRET: ${{ secrets.VERCEL_AUTOMATION_BYPASS_SECRET }}
          PREVIEW_URL: ${{ steps.preview.outputs.url }}
          PREVIEW_SKIPPED: ${{ steps.preview.outputs.skipped }}
          E2E_EVENT_NAME: ${{ github.event_name }}
        run: |
          if [ "$E2E_EVENT_NAME" = "merge_group" ]; then
            if [ "$PREVIEW_SKIPPED" = "true" ] || [ -z "$PREVIEW_URL" ]; then
              echo "merge_group preview rejected: missing-or-skipped"
              exit 1
            fi
            export E2E_BASE_URL="$PREVIEW_URL"
            node --input-type=module -e "import { assertMergeGroupPreviewUrl } from './scripts/wait-for-simy-preview.mjs'; assertMergeGroupPreviewUrl(process.env.E2E_BASE_URL)"
          elif [ "$E2E_EVENT_NAME" = "pull_request" ]; then
            export E2E_BASE_URL="${PREVIEW_URL:-https://app.simy.ch}"
          else
            export E2E_BASE_URL="https://app.simy.ch"
          fi
          using_preview=false
          case "${E2E_BASE_URL}" in
            https://app.simy.ch|https://app.simy.ch/) ;;
            *) using_preview=true ;;
          esac
          if [ "$E2E_EVENT_NAME" = "merge_group" ] && [ "$using_preview" != "true" ]; then
            echo "merge_group preview rejected: production-host"
            exit 1
          fi
          if [ "$E2E_EVENT_NAME" = "pull_request" ] && [ "$using_preview" = true ] && [ -z "$VERCEL_AUTOMATION_BYPASS_SECRET" ]; then
            echo "VERCEL_AUTOMATION_BYPASS_SECRET is not set"
            exit 1
          fi
          npm run test:e2e
