# Observer only. Publishes a <!-- simy-review-state --> comment.
# Does not merge, approve, push, deploy, or call Supabase.
#
# The comment is an observation cache. It is not permission to merge or
# to modify code. Publication updates the canonical trusted marker in
# place when one exists, creates only when none exists, and skips when
# the semantic observation is unchanged. The canonical comment is the
# greatest started_at among trusted markers. A snapshot that started
# earlier cannot become authoritative.
#
# INCIDENT CONTAINMENT (2026-10-15 notification storm / run 38666954356):
# The cron schedule is intentionally removed so main cannot fan out
# createComment across all open PRs. Re-enable only after idempotent
# publish is verified on main. workflow_dispatch remains for diagnostics.
#
# Review-thread resolution is not an event this workflow receives. The
# JSON must not claim a finite thread-age bound unless a schedule trigger
# is present on the default-branch workflow file.
# check_run runs from the default branch.
#
# Concurrency sits on the publish job, not the workflow. A check_run
# whose job if skips never takes the publishing slot. cancel-in-progress
# is false: a later job waits until the in-progress publisher has exited.
# This does not remove GitHub's single-pending-run replacement for jobs
# that actually enter the group. The job name "Publish review state" is
# not a watched check, so this workflow does not retrigger itself.

name: Review state

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review, converted_to_draft]
  pull_request_review:
    types: [submitted, edited, dismissed]
  pull_request_review_comment:
    types: [created, edited, deleted]
  check_run:
    types: [completed]
  # schedule intentionally omitted — see INCIDENT CONTAINMENT above.
  # Previous: schedule: [ cron: '*/15 * * * *' ]
  workflow_dispatch:

permissions:
  contents: read
  pull-requests: write
  checks: read

jobs:
  publish:
    name: Publish review state
    runs-on: ubuntu-latest
    timeout-minutes: 8
    if: >-
      github.event_name != 'check_run' ||
      contains(fromJSON('["Test and lint","E2E login","Dependency review","CodeQL","Analyze (javascript-typescript)","Analyze (actions)","Cursor Bugbot"]'), github.event.check_run.name)
    concurrency:
      group: simy-review-state
      cancel-in-progress: false
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Publish review state
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          EVENT_NAME: ${{ github.event_name }}
          PR_NUMBER: ${{ github.event.pull_request.number || '' }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha || github.event.check_run.head_sha || '' }}
        run: node scripts/review-state.mjs
