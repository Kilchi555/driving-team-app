name: Daily Database Backup

on:
  schedule:
    # Täglich um 02:00 UTC (04:00 MESZ)
    - cron: '0 2 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backup:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Install PostgreSQL 17 client
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y postgresql-common
          sudo /usr/share/postgresql-common/pgdg/apt.postgresql.org.sh -y
          sudo apt-get install -y postgresql-client-17

      - name: Set backup date
        id: date
        run: echo "DATE=$(date +%Y-%m-%d)" >> $GITHUB_OUTPUT

      # Secret-safe preflight: never print URL, password, query, or env values.
      # Validates structure only; auth correctness still requires a current GitHub secret.
      - name: Validate SUPABASE_DB_URL (structure only)
        env:
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          if [ -z "${SUPABASE_DB_URL:-}" ]; then
            echo "::error::GitHub Actions secret SUPABASE_DB_URL is missing or empty."
            echo "Human action: set repo secret SUPABASE_DB_URL to the current Supabase DB connection URI"
            echo "(Dashboard → Project Settings → Database → connection string; URL-encode special characters in the password)."
            exit 1
          fi
          python3 - <<'PY'
          import os, sys
          from urllib.parse import urlparse, unquote

          raw = os.environ.get("SUPABASE_DB_URL", "")
          # Never echo raw / password / query.
          try:
              u = urlparse(raw)
          except Exception:
              print("::error::SUPABASE_DB_URL is not a parseable URI.")
              sys.exit(1)

          errors = []
          if u.scheme not in ("postgresql", "postgres"):
              errors.append(f"scheme must be postgresql/postgres (got {u.scheme or 'empty'})")
          if not u.hostname:
              errors.append("hostname is missing")
          user = unquote(u.username or "")
          if not user:
              errors.append("username is missing")
          # Password may be empty only if auth is external; for Supabase dumps it must be present.
          if u.password is None or u.password == "":
              errors.append("password component is missing (rotate/reset DB password and update the secret)")
          path = (u.path or "").lstrip("/")
          dbname = path.split("/")[0] if path else ""
          if not dbname:
              errors.append("database name path is missing (expected .../postgres)")
          port = u.port
          # Safe diagnostics only — no credentials.
          print("SUPABASE_DB_URL structure OK:" if not errors else "SUPABASE_DB_URL structure FAILED:")
          print(f"  scheme={u.scheme or '-'}")
          print(f"  host={u.hostname or '-'}")
          print(f"  port={port if port is not None else 'default'}")
          print(f"  user={user or '-'}")
          print(f"  dbname={dbname or '-'}")
          print(f"  password_present={'yes' if (u.password is not None and u.password != '') else 'no'}")
          print(f"  query_present={'yes' if u.query else 'no'}")
          if errors:
              for e in errors:
                  print(f"::error::{e}")
              print("Human action: update GitHub Actions secret SUPABASE_DB_URL (do not paste the secret into chat/logs).")
              sys.exit(1)
          PY

      - name: Dump schema (plain SQL – lesbar)
        env:
          PGSSLMODE: require
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          set +e
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --schema-only \
            -f schema.sql \
            2>pg_dump_schema.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            # Print pg_dump stderr (Postgres never includes the password here).
            # Strip any accidental URI leakage just in case.
            sed -E 's#postgresql?://[^@[:space:]]+@#postgres://***:***@#g' pg_dump_schema.err >&2 || true
            if grep -qiE 'password authentication failed|authentication failed' pg_dump_schema.err; then
              echo "::error::pg_dump authentication failed for SUPABASE_DB_URL."
              echo "Likely cause: database password was rotated and GitHub secret SUPABASE_DB_URL was not updated,"
              echo "or the password in the URI is not URL-encoded."
              echo "Human action (do not paste secrets into chat):"
              echo "  1) Supabase Dashboard → Project Settings → Database → confirm/reset DB password"
              echo "  2) Copy connection URI (direct or Session mode pooler); URL-encode special chars in the password"
              echo "  3) Update GitHub Actions secret SUPABASE_DB_URL"
              echo "  4) Re-run workflow_dispatch 'Daily Database Backup' (read-only dump + R2 upload)"
            else
              echo "::error::pg_dump schema dump failed (exit $rc). See stderr above."
            fi
            exit "$rc"
          fi
          echo "✅ Schema: $(du -sh schema.sql | cut -f1)"

      - name: Dump full backup (custom format – komprimiert)
        env:
          PGSSLMODE: require
          SUPABASE_DB_URL: ${{ secrets.SUPABASE_DB_URL }}
        run: |
          set -euo pipefail
          set +e
          /usr/lib/postgresql/17/bin/pg_dump "$SUPABASE_DB_URL" \
            --format=custom \
            --compress=9 \
            -f backup.dump \
            2>pg_dump_full.err
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then
            sed -E 's#postgresql?://[^@[:space:]]+@#postgres://***:***@#g' pg_dump_full.err >&2 || true
            if grep -qiE 'password authentication failed|authentication failed' pg_dump_full.err; then
              echo "::error::pg_dump authentication failed for SUPABASE_DB_URL."
              echo "Update GitHub Actions secret SUPABASE_DB_URL with the current DB password (URL-encoded)."
            else
              echo "::error::pg_dump full dump failed (exit $rc). See stderr above."
            fi
            exit "$rc"
          fi
          echo "✅ Backup: $(du -sh backup.dump | cut -f1)"

      - name: Install rclone
        env:
          PINNED_RCLONE_VERSION: 1.69.3
        run: |
          set -euo pipefail
          sudo apt-get install -y unzip
          curl -fsSL -o /tmp/rclone.zip \
            "https://github.com/rclone/rclone/releases/download/v${PINNED_RCLONE_VERSION}/rclone-v${PINNED_RCLONE_VERSION}-linux-amd64.zip"
          unzip -qo /tmp/rclone.zip -d /tmp
          sudo install -m 0755 "/tmp/rclone-v${PINNED_RCLONE_VERSION}-linux-amd64/rclone" /usr/local/bin/rclone
          rclone version

      - name: Configure rclone
        env:
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
          SUPABASE_S3_SECRET_ACCESS_KEY: ${{ secrets.SUPABASE_S3_SECRET_ACCESS_KEY }}
        run: |
          set -euo pipefail
          umask 077
          mkdir -p "$HOME/.config/rclone"
          {
            echo '[r2]'
            echo 'type = s3'
            echo 'provider = Cloudflare'
            echo "access_key_id = ${R2_ACCESS_KEY_ID}"
            echo "secret_access_key = ${R2_SECRET_ACCESS_KEY}"
            echo "endpoint = ${R2_ENDPOINT}"
            echo 'no_check_bucket = true'
            echo
            echo '[supabase]'
            echo 'type = s3'
            echo 'provider = Other'
            echo "access_key_id = ${SUPABASE_S3_ACCESS_KEY_ID}"
            echo "secret_access_key = ${SUPABASE_S3_SECRET_ACCESS_KEY}"
            echo 'endpoint = https://unyjaetebnaexaflpyoc.supabase.co/storage/v1/s3'
            echo 'region = auto'
            echo 'no_check_bucket = true'
          } > "$HOME/.config/rclone/rclone.conf"

      - name: Upload to Cloudflare R2
        run: |
          DATE=${{ steps.date.outputs.DATE }}
          rclone copyto schema.sql "r2:${{ secrets.R2_BUCKET }}/$DATE/schema.sql"
          rclone copyto backup.dump "r2:${{ secrets.R2_BUCKET }}/$DATE/backup.dump"
          echo "✅ R2 Upload: ${{ secrets.R2_BUCKET }}/$DATE (schema.sql + backup.dump)"

      - name: Sync Supabase Storage → R2
        env:
          SUPABASE_S3_ACCESS_KEY_ID: ${{ secrets.SUPABASE_S3_ACCESS_KEY_ID }}
        run: |
          # Inkrementell: nur neue/geänderte Dateien werden übertragen.
          # Erste Ausführung ~700 MB, danach nur Deltas.
          # Ziel: r2:driving-team-backups/storage/<bucket>/...
          if [ -z "$SUPABASE_S3_ACCESS_KEY_ID" ]; then
            echo "⚠️  SUPABASE_S3_ACCESS_KEY_ID nicht gesetzt – Storage-Backup übersprungen."
            echo "    Bitte in GitHub Secrets hinterlegen (Supabase → Storage → S3 Access Keys)."
            exit 0
          fi
          echo "📂 Starte Storage-Sync..."
          rclone sync supabase: "r2:${{ secrets.R2_BUCKET }}/storage" \
            --transfers=8 \
            --checkers=16 \
            --stats=30s \
            --stats-one-line \
            2>&1 | tail -20
          echo "✅ Storage-Sync abgeschlossen: $(rclone size "r2:${{ secrets.R2_BUCKET }}/storage" --json 2>/dev/null | python3 -c "import sys,json; d=json.load(sys.stdin); print(str(round(d.get('bytes',0)/1024/1024,1))+' MB, '+str(d.get('count',0))+' Dateien')" 2>/dev/null || echo 'Grösse unbekannt')"

      - name: GFS Retention – Grandfather-Father-Son
        run: |
          TODAY=$(date +%Y-%m-%d)
          CUTOFF_DAILY=$(date -d '7 days ago' +%Y-%m-%d)
          CUTOFF_WEEKLY=$(date -d '28 days ago' +%Y-%m-%d)
          CUTOFF_MONTHLY=$(date -d '365 days ago' +%Y-%m-%d)

          echo "🗂️  GFS Retention:"
          echo "   Täglich behalten: >= $CUTOFF_DAILY"
          echo "   Wöchentlich (Mo): >= $CUTOFF_WEEKLY"
          echo "   Monatlich (1.):   >= $CUTOFF_MONTHLY"
          echo "   Jährlich (1.1.):  immer"

          rclone lsf "r2:${{ secrets.R2_BUCKET }}" --dirs-only | sort | while read folder; do
            folder="${folder%/}"
            if ! [[ "$folder" =~ ^[0-9]{4}-[0-9]{2}-[0-9]{2}$ ]]; then continue; fi

            DAY="${folder:8:2}"
            MONTH="${folder:5:2}"
            DOW=$(date -d "$folder" +%u 2>/dev/null) # 1=Montag

            KEEP=false

            # Täglich: letzte 7 Tage
            if [[ "$folder" > "$CUTOFF_DAILY" ]] || [[ "$folder" == "$CUTOFF_DAILY" ]]; then
              KEEP=true
            # Wöchentlich: Montage der letzten 4 Wochen
            elif [[ "$folder" > "$CUTOFF_WEEKLY" ]] && [[ "$DOW" == "1" ]]; then
              KEEP=true
            # Monatlich: 1. des Monats der letzten 12 Monate
            elif [[ "$folder" > "$CUTOFF_MONTHLY" ]] && [[ "$DAY" == "01" ]]; then
              KEEP=true
            # Jährlich: 1. Januar – für immer (DSG/DSGVO Compliance)
            elif [[ "$MONTH" == "01" ]] && [[ "$DAY" == "01" ]]; then
              KEEP=true
            fi

            if [[ "$KEEP" == "false" ]]; then
              rclone purge "r2:${{ secrets.R2_BUCKET }}/$folder"
              echo "🗑️  Gelöscht: $folder"
            else
              echo "✅ Behalten: $folder"
            fi
          done

      - name: Summary
        run: |
          DATE=${{ steps.date.outputs.DATE }}
          echo "🎉 Backup abgeschlossen!"
          echo "   Datum:    $DATE"
          echo "   Schema:   $(du -sh schema.sql | cut -f1)"
          echo "   Backup:   $(du -sh backup.dump | cut -f1)"
          echo "   DB:       r2:${{ secrets.R2_BUCKET }}/$DATE"
          echo "   Storage:  r2:${{ secrets.R2_BUCKET }}/storage/ (inkrementell)"
